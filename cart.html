<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- CSS -->
    <link rel="stylesheet" href="css/util.css">
    <link rel="stylesheet" href="css/main.css">
    <style>
        /* Cart Page Specific Styles - Won't interfere with main.css */
        .cart-page {
            min-height: 100vh;
            background: linear-gradient(135deg, #0a0a0a 0%, #111 100%);
            padding: 100px 0 50px;
        }

        .cart-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .cart-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .cart-title {
            font-family: 'Poppins', sans-serif;
            font-size: 2.5rem;
            font-weight: 700;
            color: #fff;
            margin: 0 0 10px 0;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .cart-subtitle {
            font-family: 'Poppins', sans-serif;
            color: rgba(255, 255, 255, 0.7);
            font-size: 1.1rem;
            margin: 0;
        }

        .cart-content {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(212, 165, 116, 0.1);
            border-radius: 20px;
            padding: 40px;
            margin-bottom: 30px;
        }

        .empty-cart {
            text-align: center;
            padding: 56px 22px 48px;
            border-radius: 22px;
            border: 1px dashed rgba(212, 175, 55, 0.22);
            background: linear-gradient(165deg, rgba(18, 18, 18, 0.75) 0%, rgba(12, 12, 12, 0.55) 100%);
            -webkit-backdrop-filter: blur(12px);
            backdrop-filter: blur(12px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.04);
        }

        .empty-cart-visual {
            font-size: 3.25rem;
            line-height: 1;
            margin: 0 auto 16px;
            display: inline-block;
            filter: drop-shadow(0 6px 20px rgba(212, 175, 55, 0.2));
            animation: emptyCartFloat 4s ease-in-out infinite;
        }

        @keyframes emptyCartFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        @media (prefers-reduced-motion: reduce) {
            .empty-cart-visual { animation: none; }
        }

        .empty-icon {
            font-size: 4rem;
            color: rgba(212, 165, 116, 0.3);
            margin-bottom: 20px;
        }

        .empty-title {
            font-family: 'Poppins', sans-serif;
            font-size: clamp(1.35rem, 4vw, 1.65rem);
            font-weight: 600;
            color: #fafafa;
            margin: 0 0 12px 0;
            letter-spacing: -0.02em;
        }

        .empty-text {
            font-family: 'Poppins', sans-serif;
            color: rgba(255, 255, 255, 0.55);
            margin: 0 0 28px 0;
            font-size: 0.98rem;
            line-height: 1.55;
            max-width: 320px;
            margin-left: auto;
            margin-right: auto;
        }

        .browse-menu-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 15px 32px;
            background: linear-gradient(135deg, #d4a574 0%, #b88a5a 100%);
            color: #111;
            text-decoration: none;
            border-radius: 999px;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            font-size: 0.95rem;
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 6px 24px rgba(212, 165, 116, 0.35);
            transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.25s ease;
        }

        .browse-menu-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 32px rgba(212, 165, 116, 0.45);
            color: #111;
        }

        .browse-menu-btn:active {
            transform: translateY(0);
        }

        .cart-items {
            margin-bottom: 30px;
        }

        .cart-item {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            margin-bottom: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
            min-height: 120px;
        }
        
        .cart-item:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }
        
        .cart-left {
            display: flex;
            align-items: flex-start;
            gap: 15px;
            flex: 1;
            min-width: 0;
        }
        
        .cart-item-image {
            width: 80px;
            height: 80px;
            border-radius: 12px;
            object-fit: cover;
            border: 2px solid rgba(212, 165, 116, 0.3);
            flex-shrink: 0;
        }
        
        .cart-item-details {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .cart-title {
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 16px;
            font-weight: 600;
            color: #fff;
            margin: 0;
            line-height: 1.3;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }
        
        .cart-qty {
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
            margin: 0;
            font-weight: 500;
        }
        
        .cart-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 8px;
            flex-shrink: 0;
            min-width: 100px;
            justify-content: space-between;
        }
        
        .cart-price {
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 16px;
            font-weight: 600;
            color: #d4a373;
            text-align: right;
            white-space: nowrap;
            order: 1;
        }
        
        .cart-delete {
            background: rgba(255, 107, 107, 0.1);
            border: 1px solid rgba(255, 107, 107, 0.2);
            color: rgba(255, 107, 107, 0.8);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
            order: 2;
        }
        
        .cart-delete:hover {
            background: rgba(255, 107, 107, 0.2);
            border-color: rgba(255, 107, 107, 0.3);
            transform: scale(1.1);
        }

        .cart-actions {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(212, 165, 116, 0.1);
            border-radius: 20px;
            padding: 30px;
        }

        .instructions-input {
            width: 100%;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(212, 165, 116, 0.2);
            border-radius: 12px;
            color: #fff;
            font-family: 'Poppins', sans-serif;
            margin-bottom: 20px;
            resize: vertical;
        }

        .instructions-input:focus {
            outline: none;
            border-color: #d4a574;
        }

        .checkout-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #d4a574 0%, #c19660 100%);
            color: #fff;
            border: none;
            border-radius: 30px;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 15px;
        }

        .checkout-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(212, 165, 116, 0.4);
        }

        .clear-btn {
            width: 100%;
            padding: 12px;
            background: transparent;
            color: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 30px;
            font-family: 'Poppins', sans-serif;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .clear-btn:hover {
            background: rgba(255, 107, 107, 0.1);
            border-color: rgba(255, 107, 107, 0.3);
            color: #ff6b6b;
        }

        .trust-badge {
            text-align: center;
            margin-top: 20px;
            font-family: 'Poppins', sans-serif;
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.85rem;
        }

        .trust-badge i {
            color: #d4a574;
            margin-right: 8px;
        }

        @media (max-width: 768px) {
            .cart-page {
                padding: 80px 0 40px;
            }
            
            .cart-title {
                font-size: 2rem;
            }
            
            .cart-content {
                padding: 25px;
            }
            
            .cart-actions {
                padding: 20px;
            }
            
            .cart-item {
                padding: 15px;
                min-height: 100px;
            }
            
            .cart-item-image {
                width: 60px;
                height: 60px;
            }
            
            .cart-title {
                font-size: 14px;
            }
            
            .cart-qty {
                font-size: 12px;
            }
            
            .cart-price {
                font-size: 14px;
            }
            
            .cart-delete {
                width: 32px;
                height: 32px;
                font-size: 12px;
            }
        }
        
        /* Cart Customizations Styling */
        .cart-item-customizations {
            margin-top: 8px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.6);
        }
        
        .cart-customization {
            padding: 2px 0;
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.7);
            line-height: 1.4;
        }
        
        .cart-customization:first-child {
            padding-top: 0;
        }
        
        .cart-special-requests {
            margin-top: 6px;
            padding: 8px 12px;
            background: rgba(212, 165, 116, 0.1);
            border-radius: 8px;
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.8);
            font-style: italic;
        }
        
        .cart-item-addons {
            margin-top: 8px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.6);
        }
        
        .cart-addon {
            padding: 2px 0;
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 12px;
            color: rgba(212, 165, 116, 0.9);
            line-height: 1.4;
            font-weight: 500;
        }
        
        .cart-addon:first-child {
            padding-top: 0;
        }
    </style>
</head>
<body>

    <!-- Main Cart Content -->
    <main class="cart-page">
        <div class="cart-container">
            <div class="cart-header">
                <h1 class="cart-title">Your Cart</h1>
                <p class="cart-subtitle">Review your order before checkout</p>
            </div>

            <div class="cart-content">

                <div class="empty-cart" id="emptyCart">

                </div>
            </div>

    </main>

    <!-- JavaScript - Non-invasive approach -->
    <script src="js/main.js"></script>
    <script>
        // Get food image based on name
        function getFoodImage(name) {
            const imageMap = {
                'Loaded Fries': 'loaded_fries_01.jpg',
                'Cheese Beef Loaded Fries': 'beef_loaded.jpg',
                'Jerk Chicken Shawarma': 'jerk_shawarma.jpeg',
                'Chocolate Rich Buttercream Frosting Jar Cake': 'choco_jar.jpeg',
                'Warning! 2 Piece Extra Insanity Hot Fried Chicken and Fries': 'hot_chicken.jpeg',
                'Loaded BBQ Chicken Cheddar Cheese Fries': 'bbq-fries.jpg',
                'Biscoff Jar Cake': 'biscoff-cake.jpg',
                'Lemon Buttercream Jar Cake': 'lemon-cake.jpg',
                'Honey BBQ Wings (6) and Fries': 'bbq_wings.jpg',
                'Siracha Mayo Hot Wings (6) and Fries': 'hot_wings.JFIF',
                '2 Piece Glazed Crispy Chicken and Fries': 'glazed-chicken.jpg',
                'Grilled Cheese Sandwich': 'grilled_sandwich.jpg',
                'Tuna Fish Sandwich': 'tuna_sandwich.jpg',
                'American BLT (Bacon Lettuce Tomato)': 'blt_sandwich.jpg',
                'Bacon Cheddar Fries': 'bacon_fries.jpg',
                'Ultimate Bacon Cheddar Burger': 'bacon_burger.jpg',
                'Melted Cheddar Burger': 'melted_cheddar.jpg',
                'Chicken Burrito': 'burrito.jpg',
                '2 Chicken Crispy Tacos': 'chicken-tacos.jpg',
                '2 Beef Crispy Tacos': 'beef-tacos.jpg',
                'Vanilla Buttercream Cake Slice': 'vanilla-cake.jpg',
                'Bailey\'s Irish Cream Jar Cake': 'baileys-cake.jpg',
                'Salted Caramel Cake': 'caramel-cake.jpg',
                'Pistachio Dream Jar Cake': 'pistachio-cake.jpg',
                'Coffee Latte Jar Cake': 'coffee-cake.jpg',
                'Pink Guava Buttercream Jar Cake': 'guava-cake.jpg',
                'Chicken and Waffles': 'chicken-waffles.jpg',
                'Loaded Omelette': 'omelette.jpg',
                'Strawberry Colada': 'strawberry-smoothie.jpg',
                'Pina Colada': 'pina-colada.jpg',
                'Watermelon Mint Ice': 'watermelon-smoothie.jpg',
                'Green Glow': 'green-smoothie.jpg',
                'Tropical Fruit Blend': 'tropical-smoothie.jpg',
                'Pineapple Strawberry': 'pineapple-strawberry.jpg',
                'Strawberries and Cream': 'strawberry-cream.jpg',
                'Lemonade Ice': 'lemonade-smoothie.jpg',
                'Banana Peanut Butter Chocolate': 'banana-smoothie.jpg'
            };
            
            return imageMap[name] || 'placeholder.jpg';
        }

        // Cart page specific functionality - Won't interfere with main.js
        document.addEventListener('DOMContentLoaded', function() {
            loadCartFromStorage();
            loadCartItems();
            updateCartDisplay();
        });

        // Load cart from localStorage
        function loadCartFromStorage() {
            const storedCart = localStorage.getItem('craveCart');
            if (storedCart) {
                try {
                    window.cartItems = JSON.parse(storedCart);
                } catch (e) {
                    window.cartItems = [];
                    localStorage.removeItem('craveCart');
                }
            } else {
                window.cartItems = [];
            }
        }

        function loadCartItems() {
            const cart = JSON.parse(localStorage.getItem('craveCart')) || [];
            const cartItemsContainer = document.getElementById('cartItems');
            const emptyCart = document.getElementById('emptyCart');
            const checkoutSection = document.getElementById('checkoutSection');
            
            if (cart.length === 0) {
                cartItemsContainer.style.display = 'none';
                checkoutSection.style.display = 'none';
                emptyCart.style.display = 'block';
                return;
            }
            
            emptyCart.style.display = 'none';
            cartItemsContainer.style.display = 'block';
            checkoutSection.style.display = 'block';
            
            // Display individual cart items with customizations (don't group)
            cartItemsContainer.innerHTML = '';
            let subtotal = 0;
            
            cart.forEach((item, index) => {
                const itemTotal = item.price * item.quantity;
                subtotal += itemTotal;
                
                const itemElement = document.createElement('div');
                itemElement.className = 'cart-item';
                
                // Build customizations HTML
                let customizationsHtml = '';
                if (item.customizations && Object.keys(item.customizations).length > 0) {
                    customizationsHtml = '<div class="cart-item-customizations">';
                    Object.values(item.customizations).forEach(selections => {
                        if (Array.isArray(selections)) {
                            selections.forEach(choice => {
                                customizationsHtml += `<div class="cart-customization">• ${choice.name}</div>`;
                            });
                        } else if (selections && selections.name) {
                            customizationsHtml += `<div class="cart-customization">• ${selections.name}</div>`;
                        }
                    });
                    customizationsHtml += '</div>';
                }
                
                // Build addons HTML
                let addonsHtml = '';
                if (item.addons && item.addons.length > 0) {
                    addonsHtml = '<div class="cart-item-addons">';
                    item.addons.forEach(addon => {
                        addonsHtml += `<div class="cart-addon">+ ${addon.name} (GH¢ ${addon.price})</div>`;
                    });
                    addonsHtml += '</div>';
                }
                
                // Add special requests if present
                let specialRequestsHtml = '';
                if (item.specialRequests) {
                    specialRequestsHtml = `<div class="cart-special-requests">📝 ${item.specialRequests}</div>`;
                }
                
                itemElement.innerHTML = `
                    <div class="cart-left">
                        <img src="images/${getFoodImage(item.name)}" alt="${item.name}" class="cart-item-image" onerror="this.src='images/placeholder.jpg'">
                        <div class="cart-item-details">
                            <h4 class="cart-title">${item.name}</h4>
                            <p class="cart-qty">Qty: ${item.quantity}</p>
                            ${customizationsHtml}
                            ${addonsHtml}
                            ${specialRequestsHtml}
                        </div>
                    </div>
                    <div class="cart-right">
                        <span class="cart-price">GH¢ ${itemTotal.toFixed(2)}</span>
                        <button class="cart-delete" onclick="removeFromCart(${index})" title="Remove item">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </div>
                `;
                cartItemsContainer.appendChild(itemElement);
            });
            
            // Update totals
            document.getElementById('subtotal').textContent = `GH¢ ${subtotal.toFixed(2)}`;
            document.getElementById('total').textContent = `GH¢ ${subtotal.toFixed(2)}`;
            
            // Update cart badge
            updateCartBadge();
        }

        function updateCartDisplay() {
            // This function can be used to update totals if needed
            const cart = JSON.parse(localStorage.getItem('craveCart')) || [];
            const cartArray = cart;
            const itemCount = cartArray.reduce((total, item) => total + item.quantity, 0);
            
            // Update page title with item count if needed
            if (itemCount > 0) {
                document.title = `Cart (${itemCount}) - Crave Restaurant`;
            }
        }

        // Update cart badge function
        function updateCartBadge() {
            const cart = JSON.parse(localStorage.getItem('craveCart')) || [];
            const cartCount = cart.length;
            const badge = document.getElementById('cartBadge');
            if (badge) {
                badge.textContent = cartCount;
                badge.style.display = cartCount > 0 ? 'flex' : 'none';
            }
        }

        // Remove item from cart
        function removeFromCart(index) {
            let cart = JSON.parse(localStorage.getItem('craveCart')) || [];
            
            // Remove specific item by index
            cart.splice(index, 1);
            
            // Save back to localStorage
            localStorage.setItem('craveCart', JSON.stringify(cart));
            
            // Update window cart items
            window.cartItems = cart;
            
            // Refresh display
            loadCartItems();
            updateCartDisplay();
            updateCartBadge();
        }

        // Clear cart functionality
        document.getElementById('clearCartBtn')?.addEventListener('click', function() {
            if (confirm('Are you sure you want to clear your cart?')) {
                localStorage.removeItem('craveCart');
                window.cartItems = [];
                loadCartItems();
                updateCartDisplay();
                updateCartBadge();
            }
        });

        // Checkout functionality
        document.getElementById('checkoutBtn')?.addEventListener('click', function() {
            const cart = JSON.parse(localStorage.getItem('craveCart')) || [];
            
            if (cart.length === 0) {
                alert('Your cart is empty. Add some items before checkout.');
                return;
            }
            
            // Redirect to checkout page
