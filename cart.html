<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="View your cart and checkout at Crave Restaurant">
    <meta name="keywords" content="cart, checkout, restaurant, accra, ghana">
    <meta name="author" content="Crave Restaurant">
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png?v=2">
    <link rel="shortcut icon" href="favicon.png?v=2">
    <link rel="apple-touch-icon" href="favicon.png?v=2">
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#d4a373">
    <meta name="apple-mobile-web-app-capable" content="yes">
    
    <title>Cart - Crave Restaurant</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- CSS -->
    <link rel="stylesheet" href="css/util.css">
    <link rel="stylesheet" href="css/main.css">
    <style>
        /* Cart Page Specific Styles - Won't interfere with main.css */
        .cart-page {
            min-height: 100vh;
            background: linear-gradient(135deg, #0a0a0a 0%, #111 100%);
            padding: 100px 0 50px;
        }

        .cart-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .cart-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .cart-title {
            font-family: 'Poppins', sans-serif;
            font-size: 2.5rem;
            font-weight: 700;
            color: #fff;
            margin: 0 0 10px 0;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .cart-subtitle {
            font-family: 'Poppins', sans-serif;
            color: rgba(255, 255, 255, 0.7);
            font-size: 1.1rem;
            margin: 0;
        }

        .cart-content {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(212, 165, 116, 0.1);
            border-radius: 20px;
            padding: 40px;
            margin-bottom: 30px;
        }

        .empty-cart {
            text-align: center;
            padding: 60px 20px;
        }

        .empty-icon {
            font-size: 4rem;
            color: rgba(212, 165, 116, 0.3);
            margin-bottom: 20px;
        }

        .empty-title {
            font-family: 'Poppins', sans-serif;
            font-size: 1.5rem;
            color: #fff;
            margin: 0 0 10px 0;
        }

        .empty-text {
            font-family: 'Poppins', sans-serif;
            color: rgba(255, 255, 255, 0.6);
            margin: 0 0 30px 0;
        }

        .browse-menu-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 14px 28px;
            background: linear-gradient(135deg, #d4a574 0%, #c19660 100%);
            color: #fff;
            text-decoration: none;
            border-radius: 30px;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .browse-menu-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(212, 165, 116, 0.4);
        }

        .cart-items {
            margin-bottom: 30px;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(212, 165, 116, 0.1);
            border-radius: 12px;
            margin-bottom: 15px;
        }

        .item-info {
            flex: 1;
        }

        .item-name {
            font-family: 'Poppins', sans-serif;
            font-size: 1.1rem;
            color: #fff;
            margin: 0 0 5px 0;
        }

        .item-price {
            font-family: 'Poppins', sans-serif;
            color: #d4a574;
            font-weight: 600;
            margin: 0;
        }

        .item-quantity {
            font-family: 'Poppins', sans-serif;
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.9rem;
        }

        .cart-actions {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(212, 165, 116, 0.1);
            border-radius: 20px;
            padding: 30px;
        }

        .instructions-input {
            width: 100%;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(212, 165, 116, 0.2);
            border-radius: 12px;
            color: #fff;
            font-family: 'Poppins', sans-serif;
            margin-bottom: 20px;
            resize: vertical;
        }

        .instructions-input:focus {
            outline: none;
            border-color: #d4a574;
        }

        .checkout-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #d4a574 0%, #c19660 100%);
            color: #fff;
            border: none;
            border-radius: 30px;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 15px;
        }

        .checkout-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(212, 165, 116, 0.4);
        }

        .clear-btn {
            width: 100%;
            padding: 12px;
            background: transparent;
            color: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 30px;
            font-family: 'Poppins', sans-serif;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .clear-btn:hover {
            background: rgba(255, 107, 107, 0.1);
            border-color: rgba(255, 107, 107, 0.3);
            color: #ff6b6b;
        }

        .trust-badge {
            text-align: center;
            margin-top: 20px;
            font-family: 'Poppins', sans-serif;
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.85rem;
        }

        .trust-badge i {
            color: #d4a574;
            margin-right: 8px;
        }

        @media (max-width: 768px) {
            .cart-page {
                padding: 80px 0 40px;
            }
            
            .cart-title {
                font-size: 2rem;
            }
            
            .cart-content {
                padding: 25px;
            }
            
            .cart-actions {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    
    <!-- Header/Navbar - Same as other pages -->
    <header id="siteHeader" class="navbar-header">
        <nav class="navbar">
            <div class="navbar-container">
                <div class="navbar-logo">
                    <a href="index.html" class="logo-link">
                        <img src="images/logo.png" alt="Crave Restaurant" class="logo-img">
                    </a>
                </div>

                <button
                    id="navbarToggle"
                    class="navbar-toggle"
                    aria-label="Toggle navigation"
                    aria-expanded="false"
                    aria-controls="navbarMenu"
                >
                    <span class="navbar-toggle-bar"></span>
                    <span class="navbar-toggle-bar"></span>
                    <span class="navbar-toggle-bar"></span>
                </button>

                <div class="navbar-menu" id="navbarMenu" aria-hidden="true" aria-label="Mobile navigation">
                    <ul class="navbar-menu-list">
                        <li class="navbar-menu-item"><a href="index.html" class="navbar-link" data-page="home">Home</a></li>
                        <li class="navbar-menu-item"><a href="menu.html" class="navbar-link" data-page="menu">Menu</a></li>
                        <li class="navbar-menu-item"><a href="about.html" class="navbar-link" data-page="about">About</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <!-- Main Cart Content -->
    <main class="cart-page">
        <div class="cart-container">
            <div class="cart-header">
                <h1 class="cart-title">Your Cart</h1>
                <p class="cart-subtitle">Review your order before checkout</p>
            </div>

            <div class="cart-content">
                <!-- Empty State -->
                <div class="empty-cart" id="emptyCart">
                    <div class="empty-icon">
                        <i class="fas fa-shopping-bag"></i>
                    </div>
                    <h2 class="empty-title">Your cart is empty 🛒</h2>
                    <p class="empty-text">Start adding delicious items from our menu</p>
                    <a href="menu.html" class="browse-menu-btn">
                        <i class="fas fa-search"></i>
                        Browse Menu
                    </a>
                </div>

                <!-- Cart Items (Hidden by default) -->
                <div class="cart-items" id="cartItems" style="display: none;">
                    <!-- Items will be dynamically added here -->
                </div>
            </div>

            <!-- Checkout Section (Hidden by default) -->
            <div class="cart-actions" id="checkoutSection" style="display: none;">
                <textarea 
                    id="specialInstructions" 
                    class="instructions-input" 
                    placeholder="Add special instructions (optional)"
                    rows="3"
                ></textarea>
                
                <button id="checkoutBtn" class="checkout-btn">
                    <i class="fas fa-shopping-cart"></i>
                    Checkout Now
                </button>
                
                <button id="clearCartBtn" class="clear-btn">
                    <i class="fas fa-trash-alt"></i>
                    Clear Cart
                </button>
                
                <div class="trust-badge">
                    <i class="fas fa-shield-alt"></i>
                    Secure checkout process
                </div>
            </div>
        </div>
    </main>

    <!-- JavaScript - Non-invasive approach -->
    <script src="js/main.js"></script>
    <script>
        // Cart page specific functionality - Won't interfere with main.js
        document.addEventListener('DOMContentLoaded', function() {
            loadCartFromStorage();
            loadCartItems();
            updateCartDisplay();
        });

        // Load cart from localStorage
        function loadCartFromStorage() {
            const storedCart = localStorage.getItem('craveCart');
            if (storedCart) {
                try {
                    window.cartItems = JSON.parse(storedCart);
                } catch (e) {
                    window.cartItems = [];
                    localStorage.removeItem('craveCart');
                }
            } else {
                window.cartItems = [];
            }
        }

        function loadCartItems() {
            const cart = JSON.parse(localStorage.getItem('craveCart')) || [];
            const cartItemsContainer = document.getElementById('cartItems');
            const emptyCart = document.getElementById('emptyCart');
            const checkoutSection = document.getElementById('checkoutSection');
            
            if (cart.length === 0) {
                cartItemsContainer.style.display = 'none';
                checkoutSection.style.display = 'none';
                emptyCart.style.display = 'block';
                return;
            }
            
            emptyCart.style.display = 'none';
            cartItemsContainer.style.display = 'block';
            checkoutSection.style.display = 'block';
            
            // Group items by name and sum quantities
            const groupedItems = {};
            cart.forEach(item => {
                if (groupedItems[item.name]) {
                    groupedItems[item.name].quantity += 1;
                } else {
                    groupedItems[item.name] = {
                        name: item.name,
                        price: item.price,
                        quantity: 1
                    };
                }
            });
            
            // Display grouped items
            cartItemsContainer.innerHTML = '';
            let subtotal = 0;
            
            Object.values(groupedItems).forEach((item, index) => {
                const itemTotal = item.price * item.quantity;
                subtotal += itemTotal;
                
                const itemElement = document.createElement('div');
                itemElement.className = 'cart-item';
                itemElement.innerHTML = `
                    <div class="cart-left">
                        <h4 class="cart-title">${item.name}</h4>
                        <p class="cart-qty">Qty: ${item.quantity}</p>
                    </div>
                    <div class="cart-right">
                        <span class="cart-price">GHS ${itemTotal.toFixed(2)}</span>
                        <button class="cart-delete" onclick="removeFromCart('${item.name}')" title="Remove item">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </div>
                `;
                cartItemsContainer.appendChild(itemElement);
            });
            
            // Update totals
            document.getElementById('subtotal').textContent = `GHS ${subtotal.toFixed(2)}`;
            document.getElementById('total').textContent = `GHS ${subtotal.toFixed(2)}`;
            
            // Update cart badge
            updateCartBadge();
        }

        function updateCartDisplay() {
            // This function can be used to update totals if needed
            const cart = JSON.parse(localStorage.getItem('craveCart')) || [];
            const cartArray = cart;
            const itemCount = cartArray.reduce((total, item) => total + item.quantity, 0);
            
            // Update page title with item count if needed
            if (itemCount > 0) {
                document.title = `Cart (${itemCount}) - Crave Restaurant`;
            }
        }

        // Update cart badge function
        function updateCartBadge() {
            const cart = JSON.parse(localStorage.getItem('craveCart')) || [];
            const cartCount = cart.length;
            const badge = document.getElementById('cartBadge');
            if (badge) {
                badge.textContent = cartCount;
                badge.style.display = cartCount > 0 ? 'flex' : 'none';
            }
        }

        // Remove item from cart
        function removeFromCart(itemName) {
            let cart = JSON.parse(localStorage.getItem('craveCart')) || [];
            
            // Remove all instances of this item
            cart = cart.filter(item => item.name !== itemName);
            
            // Save back to localStorage
            localStorage.setItem('craveCart', JSON.stringify(cart));
            
            // Update window cart items
            window.cartItems = cart;
            
            // Refresh display
            loadCartItems();
            updateCartDisplay();
            updateCartBadge();
        }

        // Clear cart functionality
        document.getElementById('clearCartBtn')?.addEventListener('click', function() {
            if (confirm('Are you sure you want to clear your cart?')) {
                localStorage.removeItem('craveCart');
                window.cartItems = [];
                loadCartItems();
                updateCartDisplay();
                updateCartBadge();
            }
        });

        // Checkout functionality
        document.getElementById('checkoutBtn')?.addEventListener('click', function() {
            const cart = JSON.parse(localStorage.getItem('craveCart')) || [];
            
            if (cart.length === 0) {
                alert('Your cart is empty. Add some items before checkout.');
                return;
            }
            
            // Redirect to checkout page
            window.location.href = 'checkout.html';
        });
    </script>
    
    <!-- PWA Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('/sw.js')
                    .then(function(registration) {
                        console.log('Service Worker registered successfully:', registration);
                    })
                    .catch(function(error) {
                        console.log('Service Worker registration failed:', error);
                    });
            });
        }
    </script>
</body>
</html>
