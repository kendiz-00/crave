<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover, shrink-to-fit=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    <meta name="description" content="Reserve a table at Crave Restaurant online.">
    <title>Reservation - Crave Restaurant</title>
    <link rel="stylesheet" href="css/util.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/glightbox/dist/css/glightbox.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
	<!-- Header -->
	<header>
		<div class="wrap-menu-header gradient1 trans-0-4">
			<div class="container h-full">
				<div class="wrap_header trans-0-3">
					<div class="logo">
						<a href="cravee.html">
							<img src="images/logo.png" alt="Crave Restaurant">
						</a>
					</div>

					<div class="wrap_menu p-l-45">
						<nav class="menu">
							<ul class="main_menu">
								<li><a href="cravee.html">Home</a></li>
								<li><a href="menu.html">Menu</a></li>
								<li><a href="reservation.html">Reservation</a></li>
								<li><a href="gallery.html">Gallery</a></li>
								<li><a href="about.html">About</a></li>
								<li><a href="blog.html">Blog</a></li>
								<li><a href="contact.html">Contact</a></li>
							</ul>
						</nav>
					</div>

					<div class="flex-w flex-l-m">
						<button class="btn-show-sidebar trans-0-4">☰</button>
					</div>
				</div>
			</div>
		</div>
	</header>

	<!-- Sidebar -->
	<aside class="sidebar trans-0-4">
		<button class="btn-hide-sidebar">✕</button>
		<ul class="menu-sidebar p-t-95 p-b-70">
			<li class="t-center m-b-13"><a href="cravee.html" class="txt19">Home</a></li>
			<li class="t-center m-b-13"><a href="menu.html" class="txt19">Menu</a></li>
			<li class="t-center m-b-13"><a href="reservation.html" class="txt19">Reservation</a></li>
			<li class="t-center m-b-13"><a href="gallery.html" class="txt19">Gallery</a></li>
			<li class="t-center m-b-13"><a href="about.html" class="txt19">About</a></li>
			<li class="t-center m-b-13"><a href="blog.html" class="txt19">Blog</a></li>
			<li class="t-center m-b-33"><a href="contact.html" class="txt19">Contact</a></li>
		</ul>
	</aside>

	<!-- Reservation Section -->
	<section class="reservation-section" style="
		padding: 80px 0;
		background: linear-gradient(135deg, #0a0a0a 0%, #111 100%);
		position: relative;
		overflow: hidden;
	">
		<div class="container">
			<div class="reservation-card" style="
				max-width: 600px;
				margin: 0 auto;
				background: rgba(255, 255, 255, 0.03);
				border: 1px solid rgba(212, 165, 116, 0.15);
				border-radius: 24px;
				padding: 40px;
				box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4),
				            0 8px 30px rgba(212, 165, 116, 0.15),
				            inset 0 1px 0 rgba(255, 255, 255, 0.05);
				position: relative;
				overflow: hidden;
				backdrop-filter: blur(10px);
			">
				<div class="reservation-header" style="
					text-align: center;
					margin-bottom: 40px;
					position: relative;
				">
					<h2 class="reservation-title" style="
						font-family: 'Poppins', sans-serif;
						font-size: 2.2rem;
						font-weight: 700;
						color: #fff;
						margin: 0 0 8px 0;
						text-transform: uppercase;
						letter-spacing: 2px;
						text-shadow: 0 2px 10px rgba(212, 165, 116, 0.3);
					">Reserve Your Table</h2>
					<p class="reservation-subtitle" style="
						font-family: 'Poppins', sans-serif;
						font-size: 1rem;
						color: rgba(255, 255, 255, 0.7);
						margin: 0;
						font-weight: 400;
						letter-spacing: 0.5px;
					">Experience dining like never before</p>
				</div>

				<form class="reservation-form" id="reservationForm" style="
					display: flex;
					flex-direction: column;
					gap: 24px;
				">
					<div class="form-row" style="
						display: flex;
						gap: 20px;
					">
						<div class="form-group" style="
							flex: 1;
							display: flex;
							flex-direction: column;
							gap: 8px;
						">
							<label for="name" class="form-label" style="
								font-family: 'Poppins', sans-serif;
								font-size: 0.9rem;
								color: rgba(255, 255, 255, 0.8);
								font-weight: 500;
								text-transform: uppercase;
								letter-spacing: 0.5px;
							">Full Name</label>
							<input type="text" id="name" name="name" class="form-input" placeholder="Enter your full name" required style="
								background: #000;
								border: 1px solid #333;
								border-radius: 12px;
								padding: 16px;
								font-family: 'Poppins', sans-serif;
								font-size: 1rem;
								color: #fff;
								transition: all 0.3s ease;
								width: 100%;
								box-sizing: border-box;
							">
						</div>
						<div class="form-group" style="
							flex: 1;
							display: flex;
							flex-direction: column;
							gap: 8px;
						">
							<label for="phone" class="form-label" style="
								font-family: 'Poppins', sans-serif;
								font-size: 0.9rem;
								color: rgba(255, 255, 255, 0.8);
								font-weight: 500;
								text-transform: uppercase;
								letter-spacing: 0.5px;
							">Phone Number</label>
							<input type="tel" id="phone" name="phone" class="form-input" placeholder="(555) 123-4567" required style="
								background: #000;
								border: 1px solid #333;
								border-radius: 12px;
								padding: 16px;
								font-family: 'Poppins', sans-serif;
								font-size: 1rem;
								color: #fff;
								transition: all 0.3s ease;
								width: 100%;
								box-sizing: border-box;
							">
						</div>
					</div>

					<div class="form-row" style="
						display: flex;
						gap: 20px;
					">
						<div class="form-group" style="
							flex: 1;
							display: flex;
							flex-direction: column;
							gap: 8px;
						">
							<label for="date" class="form-label" style="
								font-family: 'Poppins', sans-serif;
								font-size: 0.9rem;
								color: rgba(255, 255, 255, 0.8);
								font-weight: 500;
								text-transform: uppercase;
								letter-spacing: 0.5px;
							">Preferred Date</label>
							<input type="date" id="date" name="date" class="form-input" required style="
								background: #000;
								border: 1px solid #333;
								border-radius: 12px;
								padding: 16px;
								font-family: 'Poppins', sans-serif;
								font-size: 1rem;
								color: #fff;
								transition: all 0.3s ease;
								width: 100%;
								box-sizing: border-box;
							">
						</div>
						<div class="form-group" style="
							flex: 1;
							display: flex;
							flex-direction: column;
							gap: 8px;
						">
							<label for="time" class="form-label" style="
								font-family: 'Poppins', sans-serif;
								font-size: 0.9rem;
								color: rgba(255, 255, 255, 0.8);
								font-weight: 500;
								text-transform: uppercase;
								letter-spacing: 0.5px;
							">Preferred Time</label>
							<select id="time" name="time" class="form-input" required style="
								background: #000;
								border: 1px solid #333;
								border-radius: 12px;
								padding: 16px;
								font-family: 'Poppins', sans-serif;
								font-size: 1rem;
								color: #fff;
								transition: all 0.3s ease;
								width: 100%;
								box-sizing: border-box;
								cursor: pointer;
							">
								<option value="">Select time</option>
								<option value="11:00">11:00 AM</option>
								<option value="11:30">11:30 AM</option>
								<option value="12:00">12:00 PM</option>
								<option value="12:30">12:30 PM</option>
								<option value="17:00">5:00 PM</option>
								<option value="17:30">5:30 PM</option>
								<option value="18:00">6:00 PM</option>
								<option value="18:30">6:30 PM</option>
								<option value="19:00">7:00 PM</option>
								<option value="19:30">7:30 PM</option>
								<option value="20:00">8:00 PM</option>
								<option value="20:30">8:30 PM</option>
								<option value="21:00">9:00 PM</option>
								<option value="21:30">9:30 PM</option>
							</select>
						</div>
					</div>

					<div class="form-row" style="
						display: flex;
						gap: 20px;
					">
						<div class="form-group" style="
							flex: 1;
							display: flex;
							flex-direction: column;
							gap: 8px;
						">
							<label for="guests" class="form-label" style="
								font-family: 'Poppins', sans-serif;
								font-size: 0.9rem;
								color: rgba(255, 255, 255, 0.8);
								font-weight: 500;
								text-transform: uppercase;
								letter-spacing: 0.5px;
							">Number of Guests</label>
							<select id="guests" name="guests" class="form-input" required style="
								background: #000;
								border: 1px solid #333;
								border-radius: 12px;
								padding: 16px;
								font-family: 'Poppins', sans-serif;
								font-size: 1rem;
								color: #fff;
								transition: all 0.3s ease;
								width: 100%;
								box-sizing: border-box;
								cursor: pointer;
							">
								<option value="">Select number of guests</option>
								<option value="1">1 Guest</option>
								<option value="2">2 Guests</option>
								<option value="3">3 Guests</option>
								<option value="4">4 Guests</option>
								<option value="5">5 Guests</option>
								<option value="6">6 Guests</option>
								<option value="7">7 Guests</option>
								<option value="8">8 Guests</option>
								<option value="9">9+ Guests</option>
							</select>
						</div>
					</div>

					<div class="form-row" style="
						display: flex;
						gap: 20px;
					">
						<div class="form-group full-width" style="
							flex: 1 1 0;
							display: flex;
							flex-direction: column;
							gap: 8px;
						">
							<label for="message" class="form-label" style="
								font-family: 'Poppins', sans-serif;
								font-size: 0.9rem;
								color: rgba(255, 255, 255, 0.8);
								font-weight: 500;
								text-transform: uppercase;
								letter-spacing: 0.5px;
							">Special Requests</label>
							<textarea id="message" name="message" class="form-input" rows="4" placeholder="Any special requests? (e.g., high chair, window seating, celebration)" style="
								background: #000;
								border: 1px solid #333;
								border-radius: 12px;
								padding: 16px;
								font-family: 'Poppins', sans-serif;
								font-size: 1rem;
								color: #fff;
								transition: all 0.3s ease;
								width: 100%;
								box-sizing: border-box;
								resize: vertical;
								min-height: 100px;
							"></textarea>
						</div>
					</div>

					<button type="submit" class="reservation-btn" style="
						background: linear-gradient(135deg, #d4a574 0%, #c19660 100%);
						color: #fff;
						border: none;
						border-radius: 50px;
						padding: 18px 32px;
						font-family: 'Poppins', sans-serif;
						font-size: 1.1rem;
						font-weight: 600;
						cursor: pointer;
						text-transform: uppercase;
						letter-spacing: 1px;
						display: flex;
						align-items: center;
						justify-content: center;
						gap: 10px;
						position: relative;
						overflow: hidden;
						width: 100%;
						box-shadow: 0 10px 30px rgba(212, 165, 116, 0.4);
						transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
					">
						<span class="btn-text" style="position: relative; z-index: 1;">Reserve Table</span>
						<i class="fas fa-check" style="font-size: 1rem; transition: transform 0.3s ease;"></i>
					</button>
				</form>
			</div>
		</div>
	</section>

	<!-- Footer -->
	<footer>
		<div class="container">
			<p>&copy; 2024 Pato Place Restaurant. All rights reserved.</p>
			<p>
				<a href="cravee.html">Home</a> | 
				<a href="menu.html">Menu</a> | 
				<a href="reservation.html">Reservation</a> | 
				<a href="contact.html">Contact</a>
			</p>
		</div>
	</footer>

	<script src="js/vendor-setup.js"></script>
	<script src="js/main.js"></script>
</body>
</html>
