<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover, shrink-to-fit=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    <meta name="description" content="Reserve a table at Crave Restaurant online.">
    <title>Reservation - Crave Restaurant</title>
    <link rel="stylesheet" href="css/util.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/glightbox/dist/css/glightbox.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
	<!-- Header -->
	<header>
		<div class="wrap-menu-header gradient1 trans-0-4">
			<div class="container h-full">
				<div class="wrap_header trans-0-3">
					<div class="logo">
						<a href="cravee.html">
							<img src="images/logo.png" alt="Crave Restaurant">
						</a>
					</div>

					<div class="wrap_menu p-l-45">
						<nav class="menu">
							<ul class="main_menu">
								<li><a href="cravee.html">Home</a></li>
								<li><a href="menu.html">Menu</a></li>
								<li><a href="reservation.html">Reservation</a></li>
								<li><a href="gallery.html">Gallery</a></li>
								<li><a href="about.html">About</a></li>
								<li><a href="blog.html">Blog</a></li>
								<li><a href="contact.html">Contact</a></li>
							</ul>
						</nav>
					</div>

					<div class="flex-w flex-l-m">
						<button class="btn-show-sidebar trans-0-4">☰</button>
					</div>
				</div>
			</div>
		</div>
	</header>

	<!-- Sidebar -->
	<aside class="sidebar trans-0-4">
		<button class="btn-hide-sidebar">✕</button>
		<ul class="menu-sidebar p-t-95 p-b-70">
			<li class="t-center m-b-13"><a href="cravee.html" class="txt19">Home</a></li>
			<li class="t-center m-b-13"><a href="menu.html" class="txt19">Menu</a></li>
			<li class="t-center m-b-13"><a href="reservation.html" class="txt19">Reservation</a></li>
			<li class="t-center m-b-13"><a href="gallery.html" class="txt19">Gallery</a></li>
			<li class="t-center m-b-13"><a href="about.html" class="txt19">About</a></li>
			<li class="t-center m-b-13"><a href="blog.html" class="txt19">Blog</a></li>
			<li class="t-center m-b-33"><a href="contact.html" class="txt19">Contact</a></li>
		</ul>
	</aside>

	<!-- Reservation Section -->
	<section class="reservation-section">
		<div class="container">
			<div class="reservation-card">
				<div class="reservation-header">
					<h2 class="reservation-title">Reserve Your Table</h2>
					<p class="reservation-subtitle">Experience dining like never before</p>
				</div>

				<form class="reservation-form" id="reservationForm">
					<div class="form-row">
						<div class="form-group">
							<label for="name" class="form-label">Full Name</label>
							<input type="text" id="name" name="name" class="form-input" placeholder="Enter your full name" required>
						</div>
						<div class="form-group">
							<label for="phone" class="form-label">Phone Number</label>
							<input type="tel" id="phone" name="phone" class="form-input" placeholder="(555) 123-4567" required>
						</div>
					</div>

					<div class="form-row">
						<div class="form-group">
							<label for="date" class="form-label">Preferred Date</label>
							<input type="date" id="date" name="date" class="form-input" required>
						</div>
						<div class="form-group">
							<label for="time" class="form-label">Preferred Time</label>
							<select id="time" name="time" class="form-input" required>
								<option value="">Select time</option>
								<option value="11:00">11:00 AM</option>
								<option value="11:30">11:30 AM</option>
								<option value="12:00">12:00 PM</option>
								<option value="12:30">12:30 PM</option>
								<option value="17:00">5:00 PM</option>
								<option value="17:30">5:30 PM</option>
								<option value="18:00">6:00 PM</option>
								<option value="18:30">6:30 PM</option>
								<option value="19:00">7:00 PM</option>
								<option value="19:30">7:30 PM</option>
								<option value="20:00">8:00 PM</option>
								<option value="20:30">8:30 PM</option>
								<option value="21:00">9:00 PM</option>
								<option value="21:30">9:30 PM</option>
							</select>
						</div>
					</div>

					<div class="form-row">
						<div class="form-group">
							<label for="guests" class="form-label">Number of Guests</label>
							<select id="guests" name="guests" class="form-input" required>
								<option value="">Select number of guests</option>
								<option value="1">1 Guest</option>
								<option value="2">2 Guests</option>
								<option value="3">3 Guests</option>
								<option value="4">4 Guests</option>
								<option value="5">5 Guests</option>
								<option value="6">6 Guests</option>
								<option value="7">7 Guests</option>
								<option value="8">8 Guests</option>
								<option value="9">9+ Guests</option>
							</select>
						</div>
					</div>

					<div class="form-row">
						<div class="form-group full-width">
							<label for="message" class="form-label">Special Requests</label>
							<textarea id="message" name="message" class="form-input" rows="4" placeholder="Any special requests? (e.g., high chair, window seating, celebration)"></textarea>
						</div>
					</div>

					<button type="submit" class="reservation-btn">
						<span class="btn-text">Reserve Table</span>
						<i class="fas fa-check"></i>
					</button>
				</form>
			</div>
		</div>
	</section>

	<!-- Footer -->
	<footer>
		<div class="container">
			<p>&copy; 2024 Pato Place Restaurant. All rights reserved.</p>
			<p>
				<a href="cravee.html">Home</a> | 
				<a href="menu.html">Menu</a> | 
				<a href="reservation.html">Reservation</a> | 
				<a href="contact.html">Contact</a>
			</p>
		</div>
	</footer>

	<script src="js/vendor-setup.js"></script>
	<script src="js/main.js"></script>
</body>
</html>
